<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>นับตัง (NABTANG) — ผู้ช่วยการเงินและภาษีในไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Bai+Jamjuree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f9fafc; --card:#ffffff; --ink:#1a2032; --ink2:#5c6478;
  --accent:#2563eb; --accent-soft:#eef2ff; --good:#16a34a; --good-soft:#e8f7ee;
  --warn:#d97706; --warn-soft:#fff8ec; --bad:#dc2626; --bad-soft:#fdeaea;
  --line:#eceef4; --radius:14px; --shadow:0 4px 18px rgba(26,32,50,.07);
  --sidebar:230px; --topbar:60px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Anuphan',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
h1,h2,h3,h4,.num{font-family:'Bai Jamjuree',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.num{font-variant-numeric:tabular-nums}

/* ===== layout ===== */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);padding:18px 12px;z-index:60;display:flex;flex-direction:column;transition:transform .25s}
.brand{display:flex;align-items:center;gap:9px;font-family:'Bai Jamjuree';font-weight:700;font-size:19px;padding:6px 10px 18px}
.brand .dot{background:var(--good);border-radius:10px;width:32px;height:32px;display:grid;place-items:center;font-size:16px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 12px;border-radius:11px;font-size:15.5px;font-weight:500;color:var(--ink2);margin-bottom:3px}
.nav-btn .ic{font-size:19px;width:24px;text-align:center}
.nav-btn:hover{background:var(--bg)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--ink2);padding:10px 12px;border-top:1px solid var(--line)}
.topbar{position:fixed;top:0;left:var(--sidebar);right:0;height:var(--topbar);background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;z-index:50}
.topbar h1{font-size:18px;font-weight:600;flex:1}
.burger{display:none;font-size:21px;padding:6px 10px;border-radius:9px}
.burger:hover{background:var(--bg)}
.gear{font-size:19px;padding:6px 10px;border-radius:9px}
.gear:hover{background:var(--bg)}
.overlay{position:fixed;inset:0;background:rgba(26,32,50,.4);z-index:55;display:none}
.overlay.show{display:block}
main{margin-left:var(--sidebar);padding:calc(var(--topbar) + 20px) 20px 90px;max-width:760px}
@media(max-width:820px){
  .sidebar{transform:translateX(-105%)}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(26,32,50,.25)}
  .topbar{left:0}
  .burger{display:block}
  main{margin-left:0;padding-left:14px;padding-right:14px}
}

/* ===== components ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h3{font-size:16px;margin-bottom:10px}
.label{font-size:12.5px;color:var(--ink2)}
.money{font-family:'Bai Jamjuree';font-weight:700;font-variant-numeric:tabular-nums}
.g{color:var(--good)} .r{color:var(--bad)} .w{color:var(--warn)}
.chip{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.chip.good{background:var(--good-soft);color:#15803d}
.chip.warn{background:var(--warn-soft);color:#8a5a08}
.chip.bad{background:var(--bad-soft);color:#b91c1c}
.chip.info{background:var(--accent-soft);color:#3547a8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:12px 22px;font-weight:600;font-size:15.5px;transition:.15s}
.btn-main{background:var(--ink);color:#fff}
.btn-main:hover{background:var(--accent)}
.btn-main:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{border:1.5px solid #d8dce8;background:#fff;color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-block{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
select,input[type=date],input[type=text],input[type=number]{width:100%;padding:11px 13px;border:1.5px solid #d8dce8;border-radius:11px;background:#fff;color:var(--ink)}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.seg{display:flex;background:#eef0f6;border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border-radius:999px;padding:10px;font-weight:600;font-size:15px;color:var(--ink2)}
.seg button.on-out{background:var(--bad);color:#fff}
.seg button.on-in{background:var(--good);color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;border-radius:999px;padding:11px 24px;font-weight:600;font-size:14.5px;opacity:0;transition:.3s;z-index:100;white-space:nowrap;box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.empty{text-align:center;color:var(--ink2);padding:34px 10px;font-size:14.5px}
.empty .big{font-size:38px;display:block;margin-bottom:10px}

/* จดเงิน */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.cat-btn{border:1.5px solid var(--line);border-radius:12px;padding:11px 4px;text-align:center;background:#fff;font-size:13px;color:var(--ink2)}
.cat-btn .em{display:block;font-size:23px;margin-bottom:3px}
.cat-btn.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.amt-display{font-family:'Bai Jamjuree';font-weight:700;font-size:40px;text-align:center;padding:8px 0 2px;min-height:64px}
.amt-display .cur{font-size:22px;color:var(--ink2);margin-right:4px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{background:var(--bg);border-radius:12px;padding:15px 0;font-family:'Bai Jamjuree';font-size:22px;font-weight:600}
.keypad button:active{background:var(--accent-soft)}

/* รายการ */
.day-head{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;font-size:13.5px;color:var(--ink2)}
.day-head b{color:var(--ink);font-size:14.5px}
.tx{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.tx .em{font-size:22px;background:var(--bg);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;flex-shrink:0}
.tx .mid{flex:1;min-width:0}
.tx .mid .nm{font-weight:600;font-size:14.5px}
.tx .mid .nt{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-family:'Bai Jamjuree';font-weight:700;font-size:16px;text-align:right}
.tx .ops{display:flex;gap:2px}
.tx .ops button{font-size:15px;padding:6px;border-radius:8px;opacity:.55}
.tx .ops button:hover{background:var(--bg);opacity:1}

/* สรุปยอด */
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat3 .card{margin:0;padding:13px 14px}
.stat3 .money{font-size:17px}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;margin-top:12px}
.bars .b{flex:1;background:#cdd8f8;border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars .b.max{background:var(--accent)}
.bars .b.today{outline:2px solid var(--ink);outline-offset:1px}
.bar-x{display:flex;gap:2px;margin-top:5px;font-size:10.5px;color:var(--ink2)}
.bar-x span{flex:1;text-align:center}
.meter{height:10px;border-radius:99px;background:#eef0f6;overflow:hidden;margin:5px 0 12px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.cat-row{display:flex;justify-content:space-between;font-size:13.5px}
.cat-row b{font-family:'Bai Jamjuree'}

/* ภาษี wizard */
.wiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.wiz-step{font-size:12.5px;color:var(--ink2);font-weight:600}
.opt{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;margin-bottom:9px;background:#fff;font-size:15px}
.opt small{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel,.opt.sel small{color:var(--accent)}
.warn-txt{display:block;font-size:12.5px;color:var(--warn);margin-top:4px}
.calc-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.calc-line:last-child{border:none}
.calc-line b{font-family:'Bai Jamjuree';font-variant-numeric:tabular-nums;white-space:nowrap}
.calc-line .sub{color:var(--ink2);font-size:12.5px}
.step-num{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-family:'Bai Jamjuree';font-weight:700;font-size:12px;margin-right:7px;flex-shrink:0}
.helper-card .pros li{padding:3px 0 3px 24px;position:relative;font-size:13.5px;color:var(--ink2);list-style:none}
.helper-card .pros li::before{content:"✓";position:absolute;left:0;color:var(--good);font-weight:700}
.helper-card .cons li{padding:3px 0 3px 24px;position:relative;font-size:13.5px;color:var(--ink2);list-style:none}
.helper-card .cons li::before{content:"!";position:absolute;left:3px;color:var(--warn);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);height:34px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(26,32,50,.45);z-index:90;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:22px 20px 28px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
@media(min-width:821px){.modal-bg.show{align-items:center}.modal{border-radius:20px}}
.modal h3{font-size:17px;margin-bottom:14px}
.field{margin-bottom:14px}
.field .label{display:block;margin-bottom:5px}
.hint{font-size:12.5px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:9px 12px;margin-top:6px}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="dot">💚</span>นับตัง</div>
  <button class="nav-btn" data-view="home"><span class="ic">🏠</span>หน้าแรก</button>
  <button class="nav-btn" data-view="add"><span class="ic">✏️</span>จดเงิน</button>
  <button class="nav-btn" data-view="list"><span class="ic">📒</span>รายการ</button>
  <button class="nav-btn" data-view="summary"><span class="ic">📊</span>สรุปยอด</button>
  <button class="nav-btn" data-view="tax"><span class="ic">🧮</span>ภาษีของฉัน</button>
  <button class="nav-btn" data-view="reduce"><span class="ic">💡</span>ลดภาษี</button>
  <div class="side-foot">ผลภาษีเป็นการประมาณการเบื้องต้น<br>อ้างอิงเกณฑ์ปีภาษี 2568</div>
</aside>
<div class="overlay" id="overlay"></div>

<div class="topbar">
  <button class="burger" id="burger">☰</button>
  <h1 id="pageTitle">หน้าแรก</h1>
  <button class="gear" id="gearBtn" title="ตั้งค่า">⚙️</button>
</div>

<main id="content"></main>

<div class="toast" id="toast"></div>

<!-- modal ตั้งค่า -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3>⚙️ ตั้งค่า</h3>
    <div class="field"><label class="label">ชื่อเล่นของคุณ (ไว้ทักทาย)</label>
      <input type="text" id="setName" placeholder="เช่น ต้น"></div>
    <div class="field"><label class="label">LIFF ID (สำหรับเปิดในไลน์ — เว้นว่างได้)</label>
      <input type="text" id="setLiff" placeholder="เช่น 1234567890-AbcdEfgh">
      <span class="warn-txt" style="color:var(--ink2)">ดูวิธีขอ LIFF ID ได้ในไฟล์ SETUP.md</span></div>
    <div class="row2">
      <button class="btn btn-ghost" onclick="closeModal('settingsModal')">ปิด</button>
      <button class="btn btn-main" onclick="saveSettings()">บันทึก</button>
    </div>
  </div>
</div>

<!-- modal เพิ่มหมวด -->
<div class="modal-bg" id="catModal">
  <div class="modal">
    <h3>เพิ่มหมวดหมู่ใหม่</h3>
    <div class="field"><label class="label">ไอคอน (อิโมจิ 1 ตัว)</label>
      <input type="text" id="newCatEmoji" placeholder="เช่น 🐶" maxlength="4"></div>
    <div class="field"><label class="label">ชื่อหมวด</label>
      <input type="text" id="newCatName" placeholder="เช่น สัตว์เลี้ยง" maxlength="20"></div>
    <div class="row2">
      <button class="btn btn-ghost" onclick="closeModal('catModal')">ยกเลิก</button>
      <button class="btn btn-main" onclick="addCategory()">เพิ่มหมวด</button>
    </div>
  </div>
</div>

<script>
/* ================= ข้อมูล & storage ================= */
const STORE_KEY = 'nabtang_app';

function defaultDb(){
  return {
    transactions: [],
    categories: {
      out: [
        {id:'food',   emoji:'🍜', name:'อาหาร'},
        {id:'travel', emoji:'🚗', name:'เดินทาง'},
        {id:'home',   emoji:'🏠', name:'ที่อยู่/บิล'},
        {id:'shop',   emoji:'🛍️', name:'ช้อปปิ้ง'},
        {id:'fun',    emoji:'🎬', name:'บันเทิง'},
        {id:'health', emoji:'💊', name:'สุขภาพ'},
        {id:'edu',    emoji:'📚', name:'การศึกษา'},
        {id:'family', emoji:'💝', name:'ให้ครอบครัว'},
        {id:'other',  emoji:'📦', name:'อื่น ๆ'}
      ],
      in: [
        {id:'salary', emoji:'💰', name:'เงินเดือน'},
        {id:'bonus',  emoji:'🎁', name:'โบนัส'},
        {id:'inOther',emoji:'📦', name:'รายได้อื่น'}
      ]
    },
    taxProfile: null,
    settings: {name:'', liffId:''}
  };
}

let db;
function load(){
  try{
    // ย้ายข้อมูลจากคีย์ชื่อเดิม "moneyline_app" (ก่อน rebrand เป็นนับตัง) ให้อัตโนมัติ
    const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem('moneyline_app');
    if(raw){
      const d = JSON.parse(raw);
      const base = defaultDb();
      db = Object.assign(base, d);
      db.settings = Object.assign(base.settings === d.settings ? {} : {name:'',liffId:''}, d.settings || {});
      return;
    }
  }catch(e){ console.warn('โหลดข้อมูลไม่ได้', e); }
  db = defaultDb();
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch(e){ toast('⚠️ บันทึกข้อมูลลงเครื่องไม่ได้'); }
  if(typeof scheduleCloudSync === 'function') scheduleCloudSync();   // มีข้อมูลกลางก็ดันขึ้นให้ด้วย
}
load();

/* ================= helper ================= */
const $ = s => document.querySelector(s);
const MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MONTHS_S = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function fmt(n){
  const v = Math.round((+n + Number.EPSILON) * 100) / 100;
  return v.toLocaleString('en-US', {maximumFractionDigits:2});
}
function baht(n){ return '฿' + fmt(n); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function monthKey(dateStr){ return dateStr.slice(0,7); }               // "2026-09"
function thDate(dateStr){                                              // "21 ก.ย. 69"
  const [y,m,d] = dateStr.split('-').map(Number);
  return d + ' ' + MONTHS_S[m-1] + ' ' + String(y+543).slice(-2);
}
function thMonth(mk){                                                  // "กันยายน 2569"
  const [y,m] = mk.split('-').map(Number);
  return MONTHS[m-1] + ' ' + (y+543);
}
function catOf(tx){
  const list = db.categories[tx.type === 'in' ? 'in' : 'out'];
  return list.find(c => c.id === tx.cat) || {emoji:'❓', name:'ไม่ระบุ'};
}
function txOfMonth(mk){ return db.transactions.filter(t => monthKey(t.date) === mk); }
function sumBy(list, type){ return list.filter(t => t.type === type).reduce((s,t) => s + t.amount, 0); }
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= navigation ================= */
const TITLES = {home:'หน้าแรก', add:'จดเงิน', list:'รายการ', summary:'สรุปยอด', tax:'ภาษีของฉัน', reduce:'ลดภาษี'};
let view = 'home';
function go(v){
  view = v;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  $('#pageTitle').textContent = TITLES[v];
  $('#sidebar').classList.remove('open');
  $('#overlay').classList.remove('show');
  window.scrollTo(0,0);
  ({home:renderHome, add:renderAdd, list:renderList, summary:renderSummary, tax:renderTax, reduce:renderReduce})[v]();
}
document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
$('#burger').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
$('#overlay').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); });
$('#gearBtn').addEventListener('click', () => {
  $('#setName').value = db.settings.name || '';
  $('#setLiff').value = db.settings.liffId || '';
  openModal('settingsModal');
});
function saveSettings(){
  db.settings.name = $('#setName').value.trim();
  const newLiff = $('#setLiff').value.trim();
  const changed = newLiff !== (db.settings.liffId || '');
  db.settings.liffId = newLiff;
  save(); closeModal('settingsModal'); toast('บันทึกแล้ว ✓');
  if(changed && newLiff) initLiff();
  if(view === 'home') renderHome();
}

/* ================= หน้าแรก ================= */
function renderHome(){
  const today = todayStr(), mk = monthKey(today);
  const dayTx = db.transactions.filter(t => t.date === today);
  const monTx = txOfMonth(mk);
  const dIn = sumBy(dayTx,'in'), dOut = sumBy(dayTx,'out');
  const mIn = sumBy(monTx,'in'), mOut = sumBy(monTx,'out');
  const recent = [...db.transactions].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0,3);
  const name = db.settings.name;
  $('#content').innerHTML = `
    <div style="margin-bottom:14px">
      <div style="font-size:19px;font-weight:600">สวัสดี${name ? 'คุณ' + esc(name) : ''} 👋</div>
      <div class="label">${thDate(today)} · ${thMonth(mk)}</div>
      ${subChip() ? `<div style="margin-top:6px">${subChip()}</div>` : ''}
    </div>
    <div class="row2">
      <div class="card" style="margin-bottom:12px">
        <div class="label">วันนี้</div>
        <div style="display:flex;justify-content:space-between;margin-top:6px">
          <div><div class="label">รับ</div><div class="money g">${baht(dIn)}</div></div>

function fmtAmtStr(a){
  const [i, dec] = a.split('.');
  const fi = (+i || 0).toLocaleString('en-US');
  return dec !== undefined ? fi + '.' + dec : fi;
}
function setAddType(t){ if(addState.type !== t){ addState.type = t; addState.cat = null; } renderAdd(); }
function setAddCat(id){ addState.cat = id; renderAdd(); }
function key(k){
  let a = addState.amount;
  if(k === 'del') a = a.slice(0,-1);
  else if(k === '.'){ if(!a.includes('.')) a = (a || '0') + '.'; }
  else{
    if(a.includes('.')){ if(a.split('.')[1].length >= 2) return; }
    else if(a.replace('.','').length >= 9) return;
    a = (a === '0' ? '' : a) + k;
  }
  addState.amount = a;
  renderAdd();
}
function saveTx(){
  if(isPaywalled()){ go('add'); return; }

  if(s.editId){

  }else{
    db.transactions.push({id:Date.now(), type:s.type, cat:s.cat, amount:amt, date:s.date, note:s.note.trim()});

/* ===== TAX MODULE (TASK 5-6) ===== */
/* ตารางอัตราภาษีและเพดานลดหย่อน — เกณฑ์ปีภาษี 2568 (แก้กฎหมายเปลี่ยนได้ที่จุดเดียวนี้) */
const TAX = {
  year: 2568,
  brackets: [                    // [เพดานสะสมของขั้น, อัตรา]
    [150000, 0], [300000, .05], [500000, .10], [750000, .15],
    [1000000, .20], [2000000, .25], [5000000, .30], [Infinity, .35]
  ],
  expenseRate: .5, expenseCap: 100000,
  personal: 60000, spouse: 60000,
  childBase: 30000, childBoost: 60000,
  parent: 30000, parentMax: 4,
  ssoCap: 9000,
  lifeInsCap: 100000, healthInsCap: 25000, lifeHealthCap: 100000,
  parentHealthCap: 15000,
  pensionRate: .15, pensionCap: 200000,
  rmfRate: .30, rmfCap: 500000,
  pvdRate: .15, pvdCap: 500000,
  retireGroupCap: 500000,
  esgRate: .30, esgCap: 300000,
  homeLoanCap: 100000,
  donationRate: .10
};

function bracketTax(net){
  let tax = 0, prev = 0;
  const steps = [];
  for(const [cap, rate] of TAX.brackets){
    if(net <= prev) break;
    const upTo = Math.min(net, cap);
    const amt = upTo - prev;
    const t = amt * rate;
    steps.push({from: prev, to: upTo, rate, tax: t});
    tax += t;
    prev = cap;
  }
  return {tax: Math.round(tax * 100) / 100, steps};
}

/* คำนวณภาษีทั้งก้อนจาก taxProfile → คืน breakdown ครบทุกขั้น */
function calcTax(p){
  // เงินได้ 2 ก้อน: งานประจำ (ประเภทที่ 1) + ฟรีแลนซ์/รับจ้างอิสระ (ประเภทที่ 2)
  // กฎหมายให้หักค่าใช้จ่าย 50% ของสองก้อนนี้ "รวมกัน" ไม่เกิน 100,000
  const salaryIncome = Math.max(0, (+p.salaryMonthly || 0) * 12 + (+p.bonus || 0));
  const freelance = Math.max(0, +p.freelance || 0);
  const income = salaryIncome + freelance;
  const formType = freelance > 0 ? 'ภ.ง.ด.90' : 'ภ.ง.ด.91';
  const expense = Math.min(income * TAX.expenseRate, TAX.expenseCap);
  const notes = [];
  const d = [];                          // [label, amount] เรียงโชว์ผู้ใช้
  const used = {life:0, health:0, parentHealth:0, pension:0, rmf:0, pvd:0, esg:0, homeLoan:0, donEdu:0, donGen:0};

  d.push(['ลดหย่อนส่วนตัว', TAX.personal]);
  if(p.marital === 'married_no_income') d.push(['คู่สมรสไม่มีเงินได้', TAX.spouse]);
  const kids = +p.children || 0;
  if(kids > 0){
    const boost = Math.min(+p.childrenBoost || 0, Math.max(kids - 1, 0));
    d.push(['ลูก ' + kids + ' คน', kids * TAX.childBase + boost * (TAX.childBoost - TAX.childBase)]);
  }
  const par = Math.min(+p.parents || 0, TAX.parentMax);
  if(par > 0) d.push(['เลี้ยงดูพ่อแม่ ' + par + ' คน', par * TAX.parent]);
  const sso = Math.min(+p.sso || 0, TAX.ssoCap);
  if((+p.sso || 0) > TAX.ssoCap) notes.push('ประกันสังคมใช้ลดหย่อนได้ไม่เกิน ' + fmt(TAX.ssoCap));
  if(sso > 0) d.push(['ประกันสังคม', sso]);

  const x = p.ded || {};
  // ประกันชีวิต + สุขภาพ (รวมกันไม่เกิน 100,000)
  let health = Math.min(+x.health || 0, TAX.healthInsCap);
  if((+x.health || 0) > TAX.healthInsCap) notes.push('ประกันสุขภาพใช้ได้ไม่เกิน ' + fmt(TAX.healthInsCap));
  let life = Math.min(+x.life || 0, TAX.lifeInsCap);
  if((+x.life || 0) > TAX.lifeInsCap) notes.push('ประกันชีวิตใช้ได้ไม่เกิน ' + fmt(TAX.lifeInsCap));
  if(life + health > TAX.lifeHealthCap){
    life = Math.max(0, TAX.lifeHealthCap - health);
    notes.push('ประกันชีวิต + สุขภาพ รวมกันใช้ได้ไม่เกิน ' + fmt(TAX.lifeHealthCap));
  }
  if(life > 0) d.push(['ประกันชีวิต', life]);
  if(health > 0) d.push(['ประกันสุขภาพ', health]);
  const ph = Math.min(+x.parentHealth || 0, TAX.parentHealthCap);
  if((+x.parentHealth || 0) > TAX.parentHealthCap) notes.push('ประกันสุขภาพพ่อแม่ใช้ได้ไม่เกิน ' + fmt(TAX.parentHealthCap));
  if(ph > 0) d.push(['ประกันสุขภาพพ่อแม่', ph]);

  // กลุ่มเกษียณ: บำนาญ + RMF + กองทุนสำรองฯ รวมไม่เกิน 500,000
  let pension = Math.min(+x.pension || 0, income * TAX.pensionRate, TAX.pensionCap);
  if((+x.pension || 0) > pension) notes.push('ประกันบำนาญใช้ได้ไม่เกิน 15% ของรายได้ และไม่เกิน ' + fmt(TAX.pensionCap));
  let rmf = Math.min(+x.rmf || 0, income * TAX.rmfRate, TAX.rmfCap);
  if((+x.rmf || 0) > rmf) notes.push('RMF ใช้ได้ไม่เกิน 30% ของรายได้ และไม่เกิน ' + fmt(TAX.rmfCap));
  let pvd = Math.min(+x.pvd || 0, income * TAX.pvdRate, TAX.pvdCap);
  if((+x.pvd || 0) > pvd) notes.push('กองทุนสำรองเลี้ยงชีพใช้ได้ไม่เกิน 15% ของค่าจ้าง');
  if(pension + rmf + pvd > TAX.retireGroupCap){
    notes.push('กลุ่มเกษียณ (บำนาญ + RMF + กองทุนสำรองฯ) รวมกันใช้ได้ไม่เกิน ' + fmt(TAX.retireGroupCap));
    let over = pension + rmf + pvd - TAX.retireGroupCap;
    const cut = v => { const c = Math.min(v, over); over -= c; return v - c; };
    rmf = cut(rmf); pension = cut(pension); pvd = cut(pvd);
  }
  if(pension > 0) d.push(['ประกันบำนาญ', pension]);
  if(rmf > 0) d.push(['กองทุน RMF', rmf]);
  if(pvd > 0) d.push(['กองทุนสำรองเลี้ยงชีพ/กบข.', pvd]);

  const esg = Math.min(+x.esg || 0, income * TAX.esgRate, TAX.esgCap);
  if((+x.esg || 0) > esg) notes.push('Thai ESG ใช้ได้ไม่เกิน 30% ของรายได้ และไม่เกิน ' + fmt(TAX.esgCap));
  if(esg > 0) d.push(['กองทุน Thai ESG', esg]);
  const homeLoan = Math.min(+x.homeLoan || 0, TAX.homeLoanCap);
  if((+x.homeLoan || 0) > homeLoan) notes.push('ดอกเบี้ยกู้ซื้อบ้านใช้ได้ไม่เกิน ' + fmt(TAX.homeLoanCap));
  if(homeLoan > 0) d.push(['ดอกเบี้ยกู้ซื้อบ้าน', homeLoan]);

  // บริจาค: คิดจากเงินได้หลังหักค่าใช้จ่ายและลดหย่อนอื่นแล้ว (การศึกษา/รพ.รัฐ นับ 2 เท่า)
  const sumBefore = d.reduce((s, r) => s + r[1], 0);
  const donBase = Math.max(0, income - expense - sumBefore);
  const donEdu = Math.min((+x.donEdu || 0) * 2, donBase * TAX.donationRate);
  if((+x.donEdu || 0) * 2 > donEdu && donBase > 0) notes.push('บริจาคการศึกษาใช้ได้ไม่เกิน 10% ของเงินได้หลังหักลดหย่อน');
  if(donEdu > 0) d.push(['บริจาคการศึกษา/รพ.รัฐ (นับ 2 เท่า)', donEdu]);
  const donGen = Math.min(+x.donGen || 0, Math.max(0, donBase - donEdu) * TAX.donationRate);
  if((+x.donGen || 0) > donGen && donBase > 0) notes.push('บริจาคทั่วไปใช้ได้ไม่เกิน 10% ของเงินได้หลังหักลดหย่อน');
  if(donGen > 0) d.push(['เงินบริจาคทั่วไป', donGen]);

  Object.assign(used, {life, health, parentHealth: ph, pension, rmf, pvd, esg, homeLoan, donEdu, donGen});
  const totalDed = d.reduce((s, r) => s + r[1], 0);
  const net = Math.max(0, income - expense - totalDed);
  const {tax, steps} = bracketTax(net);
  const withheld = +p.withheld || 0;
  return {income, salaryIncome, freelance, formType, expense, deductions: d, totalDed, net, tax, steps, withheld, diff: tax - withheld, notes, used, donBase};
}

/* อัตราภาษีขั้นสูงสุดของผู้ใช้ (ไว้บอกว่า "ทุก 100 ที่ลดหย่อน ประหยัดราว X") */
function marginalRate(net){
  let r = 0, prev = 0;
  for(const [cap, rate] of TAX.brackets){ if(net > prev) r = rate; prev = cap; }
  return r;
}
/* ประหยัดภาษีจริงถ้าเพิ่มค่าลดหย่อนอีก add บาท */
function savingIfAdd(calc, add){
  return Math.round(calc.tax - bracketTax(Math.max(0, calc.net - add)).tax);
}

let taxWiz = null;      // {step, d} — ระหว่างทำ wizard

function salarySuggest(){
  const y = String(new Date().getFullYear());
  const txs = db.transactions.filter(t => t.type === 'in' && t.cat === 'salary' && t.date.startsWith(y));
  if(!txs.length) return null;
  const months = new Set(txs.map(t => monthKey(t.date))).size;
  return Math.round(txs.reduce((s, t) => s + t.amount, 0) / months);
}

function startTaxWizard(){
  const p = db.taxProfile;

const WIZ_TOTAL = 5;
function wizTop(title, sub){
  const s = taxWiz.step + 1;
  return `<div class="wiz-top">
      <span class="wiz-step">ขั้นตอน ${s} / ${WIZ_TOTAL}</span>
      <button class="wiz-step" style="cursor:pointer" onclick="if(confirm('ออกจากแบบประเมินใช่ไหม?')){taxWiz=null;renderTax()}">✕ ออก</button>
    </div>
    <div class="meter" style="margin:0 0 14px"><i style="width:${s / WIZ_TOTAL * 100}%"></i></div>
    <h3 style="font-size:18px;margin-bottom:4px">${title}</h3>
    <div class="label" style="margin-bottom:12px">${sub}</div>`;
}
function wizNav(nextLabel){
  return `<div class="row2" style="margin-top:16px">
    ${taxWiz.step > 0 ? '<button class="btn btn-ghost" onclick="wizGo(-1)">← ย้อนกลับ</button>' : '<span></span>'}
    <button class="btn btn-main" onclick="wizGo(1)">${nextLabel || 'ถัดไป →'}</button>
  </div>`;
}
function wizGo(dir){
  const d = taxWiz.d;
  if(dir > 0){
    if(taxWiz.step === 0){
      const income = (+d.salaryMonthly || 0) * 12 + (+d.bonus || 0) + (+d.freelance || 0);
      if(income <= 0){ toast('ใส่รายได้อย่างน้อย 1 ช่องก่อนนะ'); return; }
    }
    if(taxWiz.step === WIZ_TOTAL - 1){
      db.taxProfile = JSON.parse(JSON.stringify(d));
      save(); taxWiz = null;
      toast('ประเมินเสร็จแล้ว 🎉');
      renderTax();
      return;
    }
  }
  taxWiz.step += dir;
  renderTax();
}

      fields.map(([k, label, cap]) => `

          ${cap !== null ? `<span class="warn-txt" id="w_${k}" style="display:${(+d.ded[k] || 0) > cap ? 'block' : 'none'}">⚠️ เกินเพดาน — ระบบจะคิดให้ที่ ${fmt(Math.floor(cap))}</span>` : ''}
        </div>`).join('') +
      `<div class="hint">กลุ่มเกษียณ (บำนาญ + RMF + กองทุนสำรองฯ) รวมกันใช้ได้ไม่เกิน ${fmt(TAX.retireGroupCap)} · เงินบริจาคใช้ได้ไม่เกิน 10% ของเงินได้หลังหักลดหย่อน</div>` +
      wizNav('ดูผลภาษีของฉัน 🎉');
  }
  $('#content').innerHTML = `<div class="card">${html}</div>`;
  if(taxWiz.step === 0) updateIncomeHint();
  if(taxWiz.step === 2) updateBoostBox();
  window.scrollTo(0, 0);
}
/* อัปเดตเฉพาะจุดระหว่างพิมพ์ — ห้าม re-render ทั้งหน้า ไม่งั้นปุ่ม "ถัดไป" ต้องกด 2 ครั้ง */
function updateIncomeHint(){
  const el = document.getElementById('incomeHint');
  if(!el || !taxWiz) return;
  const d = taxWiz.d;
  const sal = +d.salaryMonthly || 0, bon = +d.bonus || 0, fre = +d.freelance || 0;
  const income = sal * 12 + bon + fre;
  el.style.display = income > 0 ? 'block' : 'none';
  if(income > 0){
    const parts = [];
    if(sal) parts.push('เงินเดือน ' + fmt(sal) + ' × 12 = ' + fmt(sal * 12));
    if(bon) parts.push('โบนัส ' + fmt(bon));
    if(fre) parts.push('ฟรีแลนซ์ ' + fmt(fre));
    el.innerHTML = 'รวมรายได้ทั้งปีประมาณ <b class="money">' + baht(income) + '</b><br>' +
      '<span style="opacity:.8">(' + parts.join(' + ') + ')</span>' +
      (fre > 0 ? '<br>มีรายได้ฟรีแลนซ์ → ยื่นแบบ <b>ภ.ง.ด.90</b> (เดี๋ยวระบบอธิบายให้)' : '');
  }
}
function updateBoostBox(){
  const el = document.getElementById('boostBox');
  if(!el || !taxWiz) return;
  const kids = +taxWiz.d.children || 0;
  el.innerHTML = kids >= 2 ? `<div class="field"><label class="label">ในจำนวนนี้ ลูกคนที่ 2 เป็นต้นไปที่เกิดปี 2561 ขึ้นไป มีกี่คน</label>

  if(kids < 2) taxWiz.d.childrenBoost = 0;
}

function helperRemaining(c){
  const u = c.used, inc = c.income;
  const groupRem = Math.max(0, TAX.retireGroupCap - (u.pension + u.rmf + u.pvd));
  const lifeHealthRem = Math.max(0, TAX.lifeHealthCap - (u.life + u.health));
  const donRem = Math.max(0, c.donBase * TAX.donationRate - u.donEdu - u.donGen);
  return {
    rmf: Math.min(Math.max(0, Math.min(inc * TAX.rmfRate, TAX.rmfCap) - u.rmf), groupRem),
    esg: Math.max(0, Math.min(inc * TAX.esgRate, TAX.esgCap) - u.esg),
    life: Math.min(Math.max(0, TAX.lifeInsCap - u.life), lifeHealthRem),
    health: Math.min(Math.max(0, TAX.healthInsCap - u.health), lifeHealthRem),
    pension: Math.min(Math.max(0, Math.min(inc * TAX.pensionRate, TAX.pensionCap) - u.pension), groupRem),
    parentHealth: Math.max(0, TAX.parentHealthCap - u.parentHealth),
    donEdu: Math.floor(donRem / 2)     // เงินที่ควักจริง (ลดหย่อนนับ 2 เท่า)
  };
}

      </div>
    </div>` : ''}
    <h3 style="margin:16px 2px 10px;font-size:16px">ตัวช่วยลดภาษีของคุณ เรียงตามความคุ้ม</h3>
    ${cards.map(h => h.rem > 0 ? `
      <div class="card helper-card">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <h3 style="margin:0">${h.emoji} ${h.name}</h3>
          <span class="chip good">ประหยัดได้ถึง ~${fmt(h.maxSave)}</span>
        </div>
        <div class="label" style="margin:6px 0 8px">${h.what}</div>
        <div class="calc-line"><span>ซื้อเพิ่มได้อีก${h.k === 'donEdu' ? ' (เงินบริจาคจริง)' : ''}</span><b>${baht(h.rem)}</b></div>
        <div class="row2" style="margin-top:10px;align-items:start">
          <div><div class="label" style="font-weight:600;color:var(--good);margin-bottom:2px">ข้อดี</div><ul class="pros">${h.pros.map(x => '<li>' + x + '</li>').join('')}</ul></div>
          <div><div class="label" style="font-weight:600;color:var(--warn);margin-bottom:2px">ข้อควรระวัง</div><ul class="cons">${h.cons.map(x => '<li>' + x + '</li>').join('')}</ul></div>
        </div>
      </div>` : `
      <div class="card" style="opacity:.65">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <h3 style="margin:0">${h.emoji} ${h.name}</h3><span class="chip info">ใช้เต็มโควตาแล้ว ✓</span>
        </div>
      </div>`).join('')}
    <div class="hint" style="margin-top:4px">💬 ตัวเลข "ประหยัดได้" คิดจากอัตราภาษีของคุณตอนนี้ เป็นการประมาณการ ·
    ข้อมูลนี้ช่วยให้เข้าใจตัวเลือก <b>ไม่ใช่คำแนะนำการลงทุนอย่างเป็นทางการ</b> —
    ก่อนซื้อจริงศึกษาเงื่อนไขของแต่ละผลิตภัณฑ์ และเลือกผู้ให้บริการที่ได้รับอนุญาตจาก ก.ล.ต. / คปภ.</div>`;
}
function updateSim(){
  const c = calcTax(db.taxProfile);
  const h = HELPERS.find(x => x.k === simState.k);
  const factor = h && h.k === 'donEdu' ? 2 : 1;
  const saveAmt = savingIfAdd(c, simState.amt * factor);
  document.getElementById('simAmt').textContent = baht(simState.amt);
  document.getElementById('simTax').textContent = baht(Math.max(0, c.tax - saveAmt));
  document.getElementById('simSave').textContent = saveAmt > 0 ? 'ประหยัด ' + fmt(saveAmt) + ' บาท' : '';
}
/* ===== END TAX MODULE ===== */

/* ===== CLOUD SYNC (TASK 14-15) — ข้อมูลกลางผูกบัญชีไลน์ ===== */
/* เปิดผ่านไลน์ + มีเซิร์ฟเวอร์ = ข้อมูล sync อัตโนมัติ · เปิดนอกไลน์/ไฟล์ตรง ๆ = โหมดในเครื่องเหมือนเดิม */
const cloud = { on:false, token:null, sub:null, timer:null };
const hasServer = location.protocol === 'http:' || location.protocol === 'https:';

async function cloudConnect(){
  if(!hasServer || !window.liff || !liff.getIDToken) return;
  try{
    const token = liff.getIDToken();
    if(!token) return;
    cloud.token = token;
    const res = await fetch('/api/data', { headers: { Authorization: 'Bearer ' + token } });
    if(!res.ok) return;                        // เซิร์ฟเวอร์ยังไม่ตั้งค่า PRO → ใช้โหมดในเครื่อง
    const remote = await res.json();
    // รวมข้อมูล: ของบนเซิร์ฟเวอร์เป็นหลัก + รายการในเครื่องที่ยังไม่เคยขึ้นไป (ยกของเก่าขึ้นให้อัตโนมัติ)
    const serverIds = new Set(remote.transactions.map(t => String(t.id)));
    const localOnly = db.transactions.filter(t => !serverIds.has(String(t.id)));
    db.transactions = remote.transactions
      .map(t => ({ id: t.id, date: t.date, type: t.type, amount: +t.amount, cat: t.cat, note: t.note || '' }))
      .concat(localOnly);
    if(remote.taxProfile) db.taxProfile = remote.taxProfile;
    if(remote.categories && remote.categories.out) db.categories = remote.categories;
    if(remote.displayName && !db.settings.name) db.settings.name = remote.displayName;
    cloud.sub = remote.subscription;
    cloud.on = true;
    save();                                    // จะดัน localOnly + taxProfile ในเครื่องขึ้นเซิร์ฟเวอร์รอบแรก
    go(view);                                  // วาดหน้าปัจจุบันใหม่ด้วยข้อมูลที่รวมแล้ว
    console.log('เชื่อมข้อมูลกลางแล้ว ✓');
  }catch(e){ console.warn('เชื่อมข้อมูลกลางไม่สำเร็จ — ใช้ข้อมูลในเครื่องไปก่อน:', e); }
}

function scheduleCloudSync(){
  if(!cloud.on) return;
  clearTimeout(cloud.timer);
  cloud.timer = setTimeout(async () => {
    try{
      const res = await fetch('/api/sync', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + cloud.token, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          transactions: db.transactions.map(t => ({ id: String(t.id), date: t.date, type: t.type, amount: t.amount, cat: t.cat, note: t.note || '' })),
          taxProfile: db.taxProfile, categories: db.categories, settings: { name: db.settings.name }
        })
      });
      if(res.ok){ const out = await res.json(); cloud.sub = out.subscription; }
    }catch(e){ /* เน็ตหลุด — ข้อมูลอยู่ในเครื่องครบ เดี๋ยว sync รอบถัดไป */ }
  }, 1200);
}

function cloudDelete(id){
  if(!cloud.on) return;
  fetch('/api/tx', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + cloud.token, 'Content-Type': 'application/json' },
    body: JSON.stringify({ action: 'delete', tx: { id: String(id) } })
  }).catch(() => {});
}

/* ---- สถานะสมาชิก + หน้าสมัคร ---- */
function isPaywalled(){ return !!(cloud.sub && cloud.sub.status === 'expired'); }
function subChip(){
  if(!cloud.sub) return '';
  const s = cloud.sub;
  if(s.status === 'active') return `<span class="chip good">สมาชิกถึง ${new Date(s.paidUntil).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'2-digit'})} ✓</span>`;
  if(s.status === 'trial') return `<span class="chip info">ทดลองฟรีเหลือ ${s.daysLeft} วัน</span>`;
  return `<span class="chip bad">หมดช่วงทดลองใช้ — แตะเมนูจดเงินเพื่อสมัคร</span>`;
}

      <div class="money" style="font-size:32px;margin:12px 0 2px">฿${(s.price||0).toLocaleString()}</div>

      ${s.promptpayId ? `<div style="font-size:15px">โอนพร้อมเพย์: <b class="money">${esc(s.promptpayId)}</b></div>` : '<div class="label">ติดต่อแอดมินในแชทไลน์เพื่อชำระเงิน</div>'}

      ระบบจะแจ้งแอดมินตรวจสอบและเปิดใช้งานให้ (รหัสสมาชิกของคุณ: <b>${esc(s.code||'-')}</b>)</div>
      <div class="label" style="margin-top:10px">ระหว่างนี้ยังเปิดดูข้อมูลเดิมและออกรายงาน CSV ได้ตามปกติ</div>
    </div>`;
}
/* ===== END CLOUD SYNC ===== */

/* ===== LIFF (TASK 7) ===== */
/* เปิดในไลน์ผ่าน LIFF: ใส่ LIFF ID ตรงนี้จุดเดียว หรือกรอกในหน้าตั้งค่า ⚙️ ก็ได้
   ไม่ใส่ = แอพทำงานในเบราว์เซอร์ปกติทุกอย่าง · โหลด SDK ไม่ได้ = ไม่พัง แค่ไม่ทักชื่อจากไลน์ */
const LIFF_ID = '2011686139-OUNayts9'; // LIFF ID ของแอพนี้ (เจ้าของยืนยันให้ฝังถาวร — LIFF ID เป็นค่าที่เปิดเผยในลิงก์ liff.line.me อยู่แล้ว)
let liffReady = false;
async function liffStart(id){
  try{
    await liff.init({liffId: id});
    liffReady = true;
    if(liff.isLoggedIn()){
      const prof = await liff.getProfile().catch(() => null);
      if(prof && prof.displayName && !db.settings.name){
        db.settings.name = prof.displayName;   // ทักทายด้วยชื่อจากไลน์
        save();
        if(view === 'home') renderHome();
      }
      cloudConnect();                          // ต่อฐานข้อมูลกลาง (มีเซิร์ฟเวอร์ถึงจะติด)
    }
  }catch(e){ console.warn('LIFF init ไม่สำเร็จ (ใช้งานต่อได้ปกติ):', e); }
}
function initLiff(){
  const id = ((db.settings.liffId || '') || LIFF_ID).trim();
  if(!id || liffReady) return;
  if(window.liff){ liffStart(id); return; }
  const s = document.createElement('script');
  s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
  s.onload = () => liffStart(id);
  s.onerror = () => console.warn('โหลด LIFF SDK ไม่ได้ — ใช้งานนอกไลน์ได้ตามปกติ');
  document.head.appendChild(s);
}
initLiff();
/* ===== END LIFF ===== */

go('home');
</script>
