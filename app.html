<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MoneyLine — ผู้ช่วยการเงินและภาษีในไลน์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Bai+Jamjuree:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f9fafc; --card:#ffffff; --ink:#1a2032; --ink2:#5c6478;
  --accent:#2563eb; --accent-soft:#eef2ff; --good:#16a34a; --good-soft:#e8f7ee;
  --warn:#d97706; --warn-soft:#fff8ec; --bad:#dc2626; --bad-soft:#fdeaea;
  --line:#eceef4; --radius:14px; --shadow:0 4px 18px rgba(26,32,50,.07);
  --sidebar:230px; --topbar:60px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Anuphan',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
h1,h2,h3,h4,.num{font-family:'Bai Jamjuree',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
.num{font-variant-numeric:tabular-nums}

/* ===== layout ===== */
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);padding:18px 12px;z-index:60;display:flex;flex-direction:column;transition:transform .25s}
.brand{display:flex;align-items:center;gap:9px;font-family:'Bai Jamjuree';font-weight:700;font-size:19px;padding:6px 10px 18px}
.brand .dot{background:var(--good);border-radius:10px;width:32px;height:32px;display:grid;place-items:center;font-size:16px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:11px 12px;border-radius:11px;font-size:15.5px;font-weight:500;color:var(--ink2);margin-bottom:3px}
.nav-btn .ic{font-size:19px;width:24px;text-align:center}
.nav-btn:hover{background:var(--bg)}
.nav-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side-foot{margin-top:auto;font-size:11.5px;color:var(--ink2);padding:10px 12px;border-top:1px solid var(--line)}
.topbar{position:fixed;top:0;left:var(--sidebar);right:0;height:var(--topbar);background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 20px;z-index:50}
.topbar h1{font-size:18px;font-weight:600;flex:1}
.burger{display:none;font-size:21px;padding:6px 10px;border-radius:9px}
.burger:hover{background:var(--bg)}
.gear{font-size:19px;padding:6px 10px;border-radius:9px}
.gear:hover{background:var(--bg)}
.overlay{position:fixed;inset:0;background:rgba(26,32,50,.4);z-index:55;display:none}
.overlay.show{display:block}
main{margin-left:var(--sidebar);padding:calc(var(--topbar) + 20px) 20px 90px;max-width:760px}
@media(max-width:820px){
  .sidebar{transform:translateX(-105%)}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 40px rgba(26,32,50,.25)}
  .topbar{left:0}
  .burger{display:block}
  main{margin-left:0;padding-left:14px;padding-right:14px}
}

/* ===== components ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.card h3{font-size:16px;margin-bottom:10px}
.label{font-size:12.5px;color:var(--ink2)}
.money{font-family:'Bai Jamjuree';font-weight:700;font-variant-numeric:tabular-nums}
.g{color:var(--good)} .r{color:var(--bad)} .w{color:var(--warn)}
.chip{display:inline-block;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.chip.good{background:var(--good-soft);color:#15803d}
.chip.warn{background:var(--warn-soft);color:#8a5a08}
.chip.bad{background:var(--bad-soft);color:#b91c1c}
.chip.info{background:var(--accent-soft);color:#3547a8}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:999px;padding:12px 22px;font-weight:600;font-size:15.5px;transition:.15s}
.btn-main{background:var(--ink);color:#fff}
.btn-main:hover{background:var(--accent)}
.btn-main:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{border:1.5px solid #d8dce8;background:#fff;color:var(--ink)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn-block{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
select,input[type=date],input[type=text],input[type=number]{width:100%;padding:11px 13px;border:1.5px solid #d8dce8;border-radius:11px;background:#fff;color:var(--ink)}
select:focus,input:focus{outline:none;border-color:var(--accent)}
.seg{display:flex;background:#eef0f6;border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border-radius:999px;padding:10px;font-weight:600;font-size:15px;color:var(--ink2)}
.seg button.on-out{background:var(--bad);color:#fff}
.seg button.on-in{background:var(--good);color:#fff}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;border-radius:999px;padding:11px 24px;font-weight:600;font-size:14.5px;opacity:0;transition:.3s;z-index:100;white-space:nowrap;box-shadow:var(--shadow)}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.empty{text-align:center;color:var(--ink2);padding:34px 10px;font-size:14.5px}
.empty .big{font-size:38px;display:block;margin-bottom:10px}

/* จดเงิน */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:10px}
.cat-btn{border:1.5px solid var(--line);border-radius:12px;padding:11px 4px;text-align:center;background:#fff;font-size:13px;color:var(--ink2)}
.cat-btn .em{display:block;font-size:23px;margin-bottom:3px}
.cat-btn.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.amt-display{font-family:'Bai Jamjuree';font-weight:700;font-size:40px;text-align:center;padding:8px 0 2px;min-height:64px}
.amt-display .cur{font-size:22px;color:var(--ink2);margin-right:4px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{background:var(--bg);border-radius:12px;padding:15px 0;font-family:'Bai Jamjuree';font-size:22px;font-weight:600}
.keypad button:active{background:var(--accent-soft)}

/* รายการ */
.day-head{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;font-size:13.5px;color:var(--ink2)}
.day-head b{color:var(--ink);font-size:14.5px}
.tx{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.tx .em{font-size:22px;background:var(--bg);border-radius:10px;width:42px;height:42px;display:grid;place-items:center;flex-shrink:0}
.tx .mid{flex:1;min-width:0}
.tx .mid .nm{font-weight:600;font-size:14.5px}
.tx .mid .nt{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-family:'Bai Jamjuree';font-weight:700;font-size:16px;text-align:right}
.tx .ops{display:flex;gap:2px}
.tx .ops button{font-size:15px;padding:6px;border-radius:8px;opacity:.55}
.tx .ops button:hover{background:var(--bg);opacity:1}

/* สรุปยอด */
.stat3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.stat3 .card{margin:0;padding:13px 14px}
.stat3 .money{font-size:17px}
.bars{display:flex;align-items:flex-end;gap:2px;height:110px;margin-top:12px}
.bars .b{flex:1;background:#cdd8f8;border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars .b.max{background:var(--accent)}
.bars .b.today{outline:2px solid var(--ink);outline-offset:1px}
.bar-x{display:flex;gap:2px;margin-top:5px;font-size:10.5px;color:var(--ink2)}
.bar-x span{flex:1;text-align:center}
.meter{height:10px;border-radius:99px;background:#eef0f6;overflow:hidden;margin:5px 0 12px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.cat-row{display:flex;justify-content:space-between;font-size:13.5px}
.cat-row b{font-family:'Bai Jamjuree'}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(26,32,50,.45);z-index:90;display:none;align-items:flex-end;justify-content:center}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;padding:22px 20px 28px;width:100%;max-width:520px;max-height:88vh;overflow-y:auto}
@media(min-width:821px){.modal-bg.show{align-items:center}.modal{border-radius:20px}}
.modal h3{font-size:17px;margin-bottom:14px}
.field{margin-bottom:14px}
.field .label{display:block;margin-bottom:5px}
.hint{font-size:12.5px;color:var(--ink2);background:var(--bg);border-radius:10px;padding:9px 12px;margin-top:6px}
</style>
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="dot">💚</span>MoneyLine</div>
  <button class="nav-btn" data-view="home"><span class="ic">🏠</span>หน้าแรก</button>
  <button class="nav-btn" data-view="add"><span class="ic">✏️</span>จดเงิน</button>
  <button class="nav-btn" data-view="list"><span class="ic">📒</span>รายการ</button>
  <button class="nav-btn" data-view="summary"><span class="ic">📊</span>สรุปยอด</button>
  <button class="nav-btn" data-view="tax"><span class="ic">🧮</span>ภาษีของฉัน</button>
  <button class="nav-btn" data-view="reduce"><span class="ic">💡</span>ลดภาษี</button>
  <div class="side-foot">ผลภาษีเป็นการประมาณการเบื้องต้น<br>อ้างอิงเกณฑ์ปีภาษี 2568</div>
</aside>
<div class="overlay" id="overlay"></div>

<div class="topbar">
  <button class="burger" id="burger">☰</button>
  <h1 id="pageTitle">หน้าแรก</h1>
  <button class="gear" id="gearBtn" title="ตั้งค่า">⚙️</button>
</div>

<main id="content"></main>

<div class="toast" id="toast"></div>

<!-- modal ตั้งค่า -->
<div class="modal-bg" id="settingsModal">
  <div class="modal">
    <h3>⚙️ ตั้งค่า</h3>
    <div class="field"><label class="label">ชื่อเล่นของคุณ (ไว้ทักทาย)</label>
      <input type="text" id="setName" placeholder="เช่น ต้น"></div>
    <div class="row2">
      <button class="btn btn-ghost" onclick="closeModal('settingsModal')">ปิด</button>
      <button class="btn btn-main" onclick="saveSettings()">บันทึก</button>
    </div>
  </div>
</div>

<!-- modal เพิ่มหมวด -->
<div class="modal-bg" id="catModal">
  <div class="modal">
    <h3>เพิ่มหมวดหมู่ใหม่</h3>
    <div class="field"><label class="label">ไอคอน (อิโมจิ 1 ตัว)</label>
      <input type="text" id="newCatEmoji" placeholder="เช่น 🐶" maxlength="4"></div>
    <div class="field"><label class="label">ชื่อหมวด</label>
      <input type="text" id="newCatName" placeholder="เช่น สัตว์เลี้ยง" maxlength="20"></div>
    <div class="row2">
      <button class="btn btn-ghost" onclick="closeModal('catModal')">ยกเลิก</button>
      <button class="btn btn-main" onclick="addCategory()">เพิ่มหมวด</button>
    </div>
  </div>
</div>

<script>
/* ================= ข้อมูล & storage ================= */
const STORE_KEY = 'moneyline_app';

function defaultDb(){
  return {
    transactions: [],
    categories: {
      out: [
        {id:'food',   emoji:'🍜', name:'อาหาร'},
        {id:'travel', emoji:'🚗', name:'เดินทาง'},
        {id:'home',   emoji:'🏠', name:'ที่อยู่/บิล'},
        {id:'shop',   emoji:'🛍️', name:'ช้อปปิ้ง'},
        {id:'fun',    emoji:'🎬', name:'บันเทิง'},
        {id:'health', emoji:'💊', name:'สุขภาพ'},
        {id:'edu',    emoji:'📚', name:'การศึกษา'},
        {id:'family', emoji:'💝', name:'ให้ครอบครัว'},
        {id:'other',  emoji:'📦', name:'อื่น ๆ'}
      ],
      in: [
        {id:'salary', emoji:'💰', name:'เงินเดือน'},
        {id:'bonus',  emoji:'🎁', name:'โบนัส'},
        {id:'inOther',emoji:'📦', name:'รายได้อื่น'}
      ]
    },
    taxProfile: null,
    settings: {name:'', liffId:''}
  };
}

let db;
function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      const base = defaultDb();
      db = Object.assign(base, d);
      db.settings = Object.assign(base.settings === d.settings ? {} : {name:'',liffId:''}, d.settings || {});
      return;
    }
  }catch(e){ console.warn('โหลดข้อมูลไม่ได้', e); }
  db = defaultDb();
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(db)); }
  catch(e){ toast('⚠️ บันทึกข้อมูลลงเครื่องไม่ได้'); }
}
load();

/* ================= helper ================= */
const $ = s => document.querySelector(s);
const MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const MONTHS_S = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function fmt(n){
  const v = Math.round((+n + Number.EPSILON) * 100) / 100;
  return v.toLocaleString('en-US', {maximumFractionDigits:2});
}
function baht(n){ return '฿' + fmt(n); }
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function monthKey(dateStr){ return dateStr.slice(0,7); }               // "2026-09"
function thDate(dateStr){                                              // "21 ก.ย. 69"
  const [y,m,d] = dateStr.split('-').map(Number);
  return d + ' ' + MONTHS_S[m-1] + ' ' + String(y+543).slice(-2);
}
function thMonth(mk){                                                  // "กันยายน 2569"
  const [y,m] = mk.split('-').map(Number);
  return MONTHS[m-1] + ' ' + (y+543);
}
function catOf(tx){
  const list = db.categories[tx.type === 'in' ? 'in' : 'out'];
  return list.find(c => c.id === tx.cat) || {emoji:'❓', name:'ไม่ระบุ'};
}
function txOfMonth(mk){ return db.transactions.filter(t => monthKey(t.date) === mk); }
function sumBy(list, type){ return list.filter(t => t.type === type).reduce((s,t) => s + t.amount, 0); }
function toast(msg){
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 2200);
}
function openModal(id){ document.getElementById(id).classList.add('show'); }
function closeModal(id){ document.getElementById(id).classList.remove('show'); }
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ================= navigation ================= */
const TITLES = {home:'หน้าแรก', add:'จดเงิน', list:'รายการ', summary:'สรุปยอด', tax:'ภาษีของฉัน', reduce:'ลดภาษี'};
let view = 'home';
function go(v){
  view = v;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  $('#pageTitle').textContent = TITLES[v];
  $('#sidebar').classList.remove('open');
  $('#overlay').classList.remove('show');
  window.scrollTo(0,0);
  ({home:renderHome, add:renderAdd, list:renderList, summary:renderSummary, tax:renderTax, reduce:renderReduce})[v]();
}
document.querySelectorAll('.nav-btn').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
$('#burger').addEventListener('click', () => { $('#sidebar').classList.add('open'); $('#overlay').classList.add('show'); });
$('#overlay').addEventListener('click', () => { $('#sidebar').classList.remove('open'); $('#overlay').classList.remove('show'); });
$('#gearBtn').addEventListener('click', () => { $('#setName').value = db.settings.name || ''; openModal('settingsModal'); });
function saveSettings(){
  db.settings.name = $('#setName').value.trim();
  save(); closeModal('settingsModal'); toast('บันทึกแล้ว ✓');
  if(view === 'home') renderHome();
}

/* ================= หน้าแรก ================= */
function renderHome(){
  const today = todayStr(), mk = monthKey(today);
  const dayTx = db.transactions.filter(t => t.date === today);
  const monTx = txOfMonth(mk);
  const dIn = sumBy(dayTx,'in'), dOut = sumBy(dayTx,'out');
  const mIn = sumBy(monTx,'in'), mOut = sumBy(monTx,'out');
  const recent = [...db.transactions].sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id).slice(0,3);
  const name = db.settings.name;
  $('#content').innerHTML = `
    <div style="margin-bottom:14px">
      <div style="font-size:19px;font-weight:600">สวัสดี${name ? 'คุณ' + esc(name) : ''} 👋</div>
      <div class="label">${thDate(today)} · ${thMonth(mk)}</div>
    </div>
    <div class="row2">
      <div class="card" style="margin-bottom:12px">
        <div class="label">วันนี้</div>
        <div style="display:flex;justify-content:space-between;margin-top:6px">
          <div><div class="label">รับ</div><div class="money g">${baht(dIn)}</div></div>
          <div style="text-align:right"><div class="label">จ่าย</div><div class="money r">${baht(dOut)}</div></div>
        </div>
      </div>
      <div class="card" style="margin-bottom:12px">
        <div class="label">เดือนนี้ · เหลือ</div>
        <div class="money" style="font-size:22px;margin-top:2px;color:${mIn-mOut >= 0 ? 'var(--good)' : 'var(--bad)'}">${baht(mIn-mOut)}</div>
        <div class="label" style="margin-top:2px">รับ ${fmt(mIn)} · จ่าย ${fmt(mOut)}</div>
      </div>
    </div>
    <button class="btn btn-main btn-block" style="padding:15px;font-size:17px;margin-bottom:14px" onclick="go('add')">＋ จดเงิน</button>
    ${taxSummaryCard()}
    <div class="card">
      <h3>รายการล่าสุด</h3>
      ${recent.length ? recent.map(txRow).join('') :
        '<div class="empty"><span class="big">🌱</span>ยังไม่มีรายการ — เริ่มจดรายการแรกกันเลย</div>'}
      ${recent.length ? '<button class="btn btn-ghost btn-block" style="margin-top:6px" onclick="go(\'list\')">ดูทั้งหมด</button>' : ''}
    </div>`;
}

/* ================= จดเงิน ================= */
let addState = {type:'out', cat:null, amount:'', date:todayStr(), note:'', editId:null};
function resetAdd(keepType){
  addState = {type: keepType ? addState.type : 'out', cat:null, amount:'', date:todayStr(), note:'', editId:null};
}
function renderAdd(){
  const s = addState;
  const cats = db.categories[s.type];
  $('#content').innerHTML = `
    ${s.editId ? '<div class="chip info" style="margin-bottom:10px">✏️ กำลังแก้ไขรายการ</div>' : ''}
    <div class="seg" style="margin-bottom:14px">
      <button class="${s.type==='out' ? 'on-out' : ''}" onclick="setAddType('out')">💸 รายจ่าย</button>
      <button class="${s.type==='in' ? 'on-in' : ''}" onclick="setAddType('in')">💰 รายรับ</button>
    </div>
    <div class="card">
      <div class="label">แตะเลือกหมวด</div>
      <div class="cat-grid">
        ${cats.map(c => `<button class="cat-btn ${s.cat===c.id ? 'sel' : ''}" onclick="setAddCat('${c.id}')"><span class="em">${c.emoji}</span>${esc(c.name)}</button>`).join('')}
        <button class="cat-btn" style="border-style:dashed" onclick="openModal('catModal')"><span class="em">➕</span>เพิ่มหมวด</button>
      </div>
    </div>
    <div class="card">
      <div class="amt-display" style="color:${s.type==='out' ? 'var(--bad)' : 'var(--good)'}">
        <span class="cur">฿</span>${s.amount ? fmtAmtStr(s.amount) : '<span style="color:#c3c8d6">0</span>'}
      </div>
      <div class="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n => `<button onclick="key('${n}')">${n}</button>`).join('')}
        <button onclick="key('.')">·</button>
        <button onclick="key('0')">0</button>
        <button onclick="key('del')">⌫</button>
      </div>
    </div>
    <div class="card">
      <div class="row2">
        <div class="field" style="margin:0"><label class="label">วันที่</label>
          <input type="date" id="addDate" value="${s.date}" max="${todayStr()}" onchange="addState.date=this.value"></div>
        <div class="field" style="margin:0"><label class="label">โน้ต (ไม่บังคับ)</label>
          <input type="text" id="addNote" value="${esc(s.note)}" placeholder="เช่น ข้าวมันไก่" maxlength="60" oninput="addState.note=this.value"></div>
      </div>
    </div>
    <div class="row2">
      ${s.editId ? '<button class="btn btn-ghost" onclick="cancelEdit()">ยกเลิก</button>' : '<button class="btn btn-ghost" onclick="resetAdd(true);renderAdd()">ล้าง</button>'}
      <button class="btn btn-main" onclick="saveTx()">${s.editId ? 'บันทึกการแก้ไข' : 'บันทึก ✓'}</button>
    </div>`;
}
function fmtAmtStr(a){
  const [i, dec] = a.split('.');
  const fi = (+i || 0).toLocaleString('en-US');
  return dec !== undefined ? fi + '.' + dec : fi;
}
function setAddType(t){ if(addState.type !== t){ addState.type = t; addState.cat = null; } renderAdd(); }
function setAddCat(id){ addState.cat = id; renderAdd(); }
function key(k){
  let a = addState.amount;
  if(k === 'del') a = a.slice(0,-1);
  else if(k === '.'){ if(!a.includes('.')) a = (a || '0') + '.'; }
  else{
    if(a.includes('.')){ if(a.split('.')[1].length >= 2) return; }
    else if(a.replace('.','').length >= 9) return;
    a = (a === '0' ? '' : a) + k;
  }
  addState.amount = a;
  renderAdd();
}
function saveTx(){
  const s = addState;
  const amt = parseFloat(s.amount);
  if(!s.cat){ toast('แตะเลือกหมวดก่อนนะ'); return; }
  if(!amt || amt <= 0){ toast('ใส่จำนวนเงินก่อนนะ'); return; }
  if(!s.date){ toast('เลือกวันที่ก่อนนะ'); return; }
  if(s.editId){
    const tx = db.transactions.find(t => t.id === s.editId);
    if(tx) Object.assign(tx, {type:s.type, cat:s.cat, amount:amt, date:s.date, note:s.note.trim()});
    save(); resetAdd(); toast('แก้ไขแล้ว ✓'); go('list');
  }else{
    db.transactions.push({id:Date.now(), type:s.type, cat:s.cat, amount:amt, date:s.date, note:s.note.trim()});
    save();
    const keep = s.type; resetAdd(); addState.type = keep;
    toast('จดแล้ว ✓ ' + baht(amt));
    renderAdd();
  }
}
function editTx(id){
  const tx = db.transactions.find(t => t.id === id);
  if(!tx) return;
  addState = {type:tx.type, cat:tx.cat, amount:String(tx.amount), date:tx.date, note:tx.note || '', editId:id};
  go('add');
}
function cancelEdit(){ resetAdd(); go('list'); }
function delTx(id){
  if(!confirm('ลบรายการนี้ใช่ไหม?')) return;
  db.transactions = db.transactions.filter(t => t.id !== id);
  save(); toast('ลบแล้ว');
  renderList();
}
function addCategory(){
  const emoji = $('#newCatEmoji').value.trim() || '🔖';
  const name = $('#newCatName').value.trim();
  if(!name){ toast('ตั้งชื่อหมวดก่อนนะ'); return; }
  const id = 'c' + Date.now();
  db.categories[addState.type].push({id, emoji, name});
  save();
  $('#newCatEmoji').value = ''; $('#newCatName').value = '';
  closeModal('catModal');
  addState.cat = id;
  toast('เพิ่มหมวด "' + name + '" แล้ว ✓');
  if(view === 'add') renderAdd();
}

/* ================= รายการ ================= */
let listFilter = {month:'all', cat:'all'};
function monthOptions(){
  const set = new Set(db.transactions.map(t => monthKey(t.date)));
  set.add(monthKey(todayStr()));
  return [...set].sort().reverse();
}
function txRow(t){
  const c = catOf(t);
  return `<div class="tx">
    <div class="em">${c.emoji}</div>
    <div class="mid">
      <div class="nm">${esc(c.name)}</div>
      <div class="nt">${thDate(t.date)}${t.note ? ' · ' + esc(t.note) : ''}</div>
    </div>
    <div class="amt ${t.type==='in' ? 'g' : 'r'}">${t.type==='in' ? '+' : '−'}${fmt(t.amount)}</div>
    <div class="ops">
      <button title="แก้ไข" onclick="editTx(${t.id})">✏️</button>
      <button title="ลบ" onclick="delTx(${t.id})">🗑️</button>
    </div>
  </div>`;
}
function renderList(){
  const f = listFilter;
  let txs = [...db.transactions];
  if(f.month !== 'all') txs = txs.filter(t => monthKey(t.date) === f.month);
  if(f.cat !== 'all') txs = txs.filter(t => t.cat === f.cat);
  txs.sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  const allCats = [...db.categories.out, ...db.categories.in];
  // จัดกลุ่มรายวัน
  const groups = {};
  txs.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
  const dates = Object.keys(groups).sort().reverse();
  $('#content').innerHTML = `
    <div class="row2" style="margin-bottom:12px">
      <select onchange="listFilter.month=this.value;renderList()">
        <option value="all" ${f.month==='all'?'selected':''}>ทุกเดือน</option>
        ${monthOptions().map(mk => `<option value="${mk}" ${f.month===mk?'selected':''}>${thMonth(mk)}</option>`).join('')}
      </select>
      <select onchange="listFilter.cat=this.value;renderList()">
        <option value="all" ${f.cat==='all'?'selected':''}>ทุกหมวด</option>
        ${allCats.map(c => `<option value="${c.id}" ${f.cat===c.id?'selected':''}>${c.emoji} ${esc(c.name)}</option>`).join('')}
      </select>
    </div>
    ${txs.length ? `
      <div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <div><div class="label">ช่วงที่เลือก · ${txs.length} รายการ</div>
          <div style="font-size:14px;margin-top:2px"><span class="money g">+${fmt(sumBy(txs,'in'))}</span> · <span class="money r">−${fmt(sumBy(txs,'out'))}</span></div></div>
        <button class="btn btn-ghost" style="padding:9px 16px;font-size:13.5px" onclick="exportCSV()">📄 ออกรายงาน CSV</button>
      </div>
      ${dates.map(d => {
        const g = groups[d], gi = sumBy(g,'in'), go_ = sumBy(g,'out');
        return `<div class="day-head"><b>${d === todayStr() ? 'วันนี้ · ' : ''}${thDate(d)}</b>
          <span>${gi ? '+' + fmt(gi) + ' ' : ''}${go_ ? '−' + fmt(go_) : ''}</span></div>` + g.map(txRow).join('');
      }).join('')}`
    : '<div class="card"><div class="empty"><span class="big">📭</span>ไม่มีรายการในช่วงที่เลือก</div></div>'}`;
}
function exportCSV(){
  const f = listFilter;
  let txs = [...db.transactions];
  if(f.month !== 'all') txs = txs.filter(t => monthKey(t.date) === f.month);
  if(f.cat !== 'all') txs = txs.filter(t => t.cat === f.cat);
  txs.sort((a,b) => a.date.localeCompare(b.date) || a.id - b.id);
  const rows = [['วันที่','ประเภท','หมวดหมู่','จำนวนเงิน','โน้ต']];
  txs.forEach(t => rows.push([t.date, t.type==='in' ? 'รายรับ' : 'รายจ่าย', catOf(t).name, t.amount, t.note || '']));
  const csv = '﻿' + rows.map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = 'moneyline_' + (f.month === 'all' ? 'all' : f.month) + '.csv';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('ออกไฟล์ CSV แล้ว ✓');
}

/* ================= สรุปยอด ================= */
let sumMonth = null;
function renderSummary(){
  const mks = monthOptions();
  if(!sumMonth || !mks.includes(sumMonth)) sumMonth = monthKey(todayStr());
  const mk = sumMonth;
  const txs = txOfMonth(mk);
  const mIn = sumBy(txs,'in'), mOut = sumBy(txs,'out');
  // เดือนก่อน
  const [y,m] = mk.split('-').map(Number);
  const prevMk = (m === 1 ? (y-1) + '-12' : y + '-' + String(m-1).padStart(2,'0'));
  const prevOut = sumBy(txOfMonth(prevMk),'out');
  // กราฟรายวัน (รายจ่าย)
  const daysIn = new Date(y, m, 0).getDate();
  const perDay = Array.from({length:daysIn}, () => 0);
  txs.filter(t => t.type==='out').forEach(t => perDay[+t.date.slice(8,10) - 1] += t.amount);
  const maxDay = Math.max(...perDay, 1);
  const maxIdx = perDay.indexOf(Math.max(...perDay));
  const today = todayStr();
  const isThisMonth = monthKey(today) === mk;
  // สัดส่วนรายจ่ายตามหมวด
  const byCat = {};
  txs.filter(t => t.type==='out').forEach(t => byCat[t.cat] = (byCat[t.cat] || 0) + t.amount);
  const catRows = Object.entries(byCat).sort((a,b) => b[1]-a[1]);
  // เทียบเดือนก่อน
  let compareHtml = '';
  if(prevOut > 0 || mOut > 0){
    const diff = mOut - prevOut;
    const pct = prevOut > 0 ? Math.abs(Math.round(diff / prevOut * 100)) : null;
    compareHtml = `<div class="card">
      <h3>เทียบกับ${thMonth(prevMk)}</h3>
      <div class="cat-row"><span>เดือนก่อนจ่าย</span><b class="money">${baht(prevOut)}</b></div>
      <div class="cat-row" style="margin-top:4px"><span>เดือนนี้จ่าย</span><b class="money">${baht(mOut)}</b></div>
      <div style="margin-top:10px">${
        diff === 0 ? '<span class="chip info">เท่ากับเดือนก่อนพอดี</span>' :
        diff < 0 ? `<span class="chip good">👏 จ่ายน้อยลง ${fmt(-diff)}${pct !== null ? ' (−' + pct + '%)' : ''}</span>` :
        `<span class="chip bad">จ่ายเพิ่มขึ้น ${fmt(diff)}${pct !== null ? ' (+' + pct + '%)' : ''}</span>`
      }</div>
    </div>`;
  }
  $('#content').innerHTML = `
    <select style="margin-bottom:14px" onchange="sumMonth=this.value;renderSummary()">
      ${mks.map(k => `<option value="${k}" ${k===mk?'selected':''}>${thMonth(k)}</option>`).join('')}
    </select>
    <div class="stat3">
      <div class="card"><div class="label">รายรับ</div><div class="money g">${baht(mIn)}</div></div>
      <div class="card"><div class="label">รายจ่าย</div><div class="money r">${baht(mOut)}</div></div>
      <div class="card"><div class="label">คงเหลือ</div><div class="money" style="color:${mIn-mOut>=0?'var(--good)':'var(--bad)'}">${baht(mIn-mOut)}</div></div>
    </div>
    ${txs.length ? `
    <div class="card">
      <h3>รายจ่ายรายวัน</h3>
      <div class="label">แท่งสีเข้ม = วันที่จ่ายเยอะสุด${mOut ? ' (' + fmt(perDay[maxIdx]) + ' บาท วันที่ ' + (maxIdx+1) + ')' : ''}</div>
      <div class="bars">${perDay.map((v,i) =>
        `<div class="b ${v === maxDay && v > 0 ? 'max' : ''} ${isThisMonth && i+1 === +today.slice(8,10) ? 'today' : ''}" style="height:${Math.max(v/maxDay*100, 2)}%" title="วันที่ ${i+1}: ${fmt(v)}"></div>`).join('')}</div>
      <div class="bar-x"><span>1</span><span>${Math.round(daysIn/4)}</span><span>${Math.round(daysIn/2)}</span><span>${Math.round(daysIn*3/4)}</span><span>${daysIn}</span></div>
    </div>
    <div class="card">
      <h3>จ่ายหมวดไหนเยอะสุด</h3>
      ${catRows.length ? catRows.map(([cid, v]) => {
        const c = db.categories.out.find(x => x.id === cid) || {emoji:'❓', name:'ไม่ระบุ'};
        const pct = Math.round(v / mOut * 100);
        return `<div class="cat-row"><span>${c.emoji} ${esc(c.name)}</span><b>${fmt(v)} · ${pct}%</b></div>
          <div class="meter"><i style="width:${pct}%"></i></div>`;
      }).join('') : '<div class="empty">เดือนนี้ยังไม่มีรายจ่าย</div>'}
    </div>
    ${compareHtml}`
    : '<div class="card"><div class="empty"><span class="big">📭</span>เดือนนี้ยังไม่มีรายการ — ไปจดเงินกันก่อน</div></div>'}`;
}
